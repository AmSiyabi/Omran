name: omran

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: omran-app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8080:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PHP_CLI_SERVER_WORKERS: "4"

  db:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: omran
      MYSQL_USER: omran
      MYSQL_PASSWORD: omran_local_secret
      MYSQL_ROOT_PASSWORD: root_local_secret
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot_local_secret"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
  redisdata:
